<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noah Kline — Photography</title>
<style>
  :root { --bg:#0a0a0a; --fg:#f2f2f2; --accent:#c9a876; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; line-height:1.6; }
  header { padding: 6rem 2rem 3rem; text-align:center; }
  header h1 { font-size: 2.5rem; font-weight:300; letter-spacing: 0.05em; }
  header p { color: #999; margin-top: 0.5rem; font-size: 1rem; }
  nav { display:flex; justify-content:center; gap:2rem; padding: 1rem 0 3rem; border-bottom: 1px solid #222; }
  nav a { color:#ccc; text-decoration:none; font-size:0.95rem; letter-spacing:0.03em; transition: color 0.2s; }
  nav a:hover { color: var(--accent); }
  .gallery { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 4px; padding: 2px; }
  .gallery figure { margin:0; overflow:hidden; aspect-ratio: 4/3; background:#111; }
  .gallery img { width:100%; height:100%; object-fit:cover; display:block; transition: transform 0.4s ease; }
  .gallery figure:hover img { transform: scale(1.05); }
  section { padding: 4rem 2rem; max-width: 900px; margin: 0 auto; }
  footer { text-align:center; padding: 3rem 2rem; color:#666; font-size:0.85rem; border-top:1px solid #222; margin-top:2rem;}
  a.contact { color: var(--accent); text-decoration:none; }
  .placeholder { display:flex; align-items:center; justify-content:center; color:#555; font-size:0.85rem; height:100%; }
</style>
</head>
<body>
<header>
  <h1>NOAH KLINE</h1>
  <p>Photography</p>
</header>
<nav>
  <a href="#gallery">Gallery</a>
  <a href="#about">About</a>
  <a href="#contact">Contact</a>
</nav>
<section id="gallery">
  <div class="gallery">
    <figure><div class="placeholder">Photo coming soon</div></figure>
    <figure><div class="placeholder">Photo coming soon</div></figure>
    <figure><div class="placeholder">Photo coming soon</div></figure>
    <figure><div class="placeholder">Photo coming soon</div></figure>
    <figure><div class="placeholder">Photo coming soon</div></figure>
    <figure><div class="placeholder">Photo coming soon</div></figure>
  </div>
</section>
<section id="about">
  <h2 style="font-weight:300; margin-bottom:1rem;">About</h2>
  <p style="color:#bbb;">Photographer based in New Zealand. Portfolio under construction — check back soon for the full gallery.</p>
</section>
<section id="contact">
  <h2 style="font-weight:300; margin-bottom:1rem;">Contact</h2>
  <p style="color:#bbb;">Get in touch: <a class="contact" href="mailto:hello@example.com">hello@example.com</a></p>
</section>
<footer>&copy; 2026 Noah Kline Photography</footer>
</body>
</html>
